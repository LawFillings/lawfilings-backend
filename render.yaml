# Render Blueprint — first-time production setup for LawFilings.
#
# This file lets Render create everything (database + backend + frontend) in one guided flow
# instead of configuring three separate things by hand: Render Dashboard -> New -> Blueprint ->
# point it at this repo (lawfilings-backend) -> it reads this file automatically.
#
# Fields marked `sync: false` are secrets/values Render will prompt you to type in during that
# same setup wizard — nothing needs to be edited in this file itself.
#
# One thing this file cannot do for you: the frontend needs the backend's live URL
# (VITE_API_BASE_URL) once it exists. After the first deploy, copy the backend service's URL from
# its Render dashboard page and paste it in as that env var on the frontend service, then trigger
# one manual redeploy of the frontend. See the deploy notes given alongside this file for the full
# step-by-step, including the one-time database migration command.

databases:
  - name: lawfilings-db
    plan: free # Render's free Postgres expires after 90 days — fine to start, upgrade before then.
    databaseName: lawfilings
    user: lawfilings

services:
  - type: web
    name: lawfilings-backend
    env: node
    repo: https://github.com/LawFillings/lawfilings-backend
    plan: free # Free web services spin down after inactivity and cold-start on the next request —
    # upgrade to a paid plan once this is genuinely serving real advocates.
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lawfilings-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: lawfilings-frontend
    env: static
    repo: https://github.com/LawFillings/lawfilings-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Fill this in with the backend service's URL AFTER it's been created once —
        # see the deploy notes for why this can't be wired up automatically here.
